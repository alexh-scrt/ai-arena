  - context preservation
  - source verification
  - temporal ordering
  - completeness
  quirks:
  - corrects others on timing details
  - remembers exact wording of testimony
  - asks 'when exactly did that happen?'
  - cross-references witness statements chronologically
  strengths:
  - exceptional recall of testimony details
  - precise timeline tracking
  - consistency checking across witnesses
  - spotting contradictions in repeated testimony
  - meticulous evidence cataloging
  weaknesses:
  - may get lost in details, miss the big picture
  - recency bias — gives more weight to facts presented later
  - struggles to prioritize which details matter most
  - can be overwhelmed by volume of evidence
  blind_spots:
  - name: "Recency Bias"
    severity: 0.70
    description: "May give more weight to evidence presented later in the deliberation; earlier facts may fade"

