  quirks:
  - watches body language during testimony
  - asks 'what would drive someone to do that?'
  - sensitive to emotional weight of evidence
  - considers the impact on surviving family
  strengths:
  - excellent credibility assessment
  - understands human motivation
  - reads emotional subtext
  - contextualizes behavior within life circumstances
  - compassionate but not gullible
  weaknesses:
  - may give too much weight to sympathetic testimony
  - emotional responses can color judgment
  - may struggle with cold, dispassionate evidence
  - can be swayed by powerful narratives
  blind_spots:
