  location: Chapel Hill, North Carolina
  education: PhD in organizational psychology, mediation certification
  interests:
  - group dynamics
  - consensus building
  - decision theory
  - conflict resolution
  gender: non_binary

personality:
  big_five:
    openness: 0.8
    conscientiousness: 0.85
    extraversion: 0.65
    agreeableness: 0.75
    neuroticism: 0.25
  behavioral_traits:
