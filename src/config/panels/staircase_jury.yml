# Staircase Case — Jury Deliberation Panel
# Six jurors deliberate the death of Kathleen Peterson

panel_name: "The Staircase — Jury Deliberation"
description: >
  Six specialized jurors deliberate the case of State v. Michael Peterson.
  Each juror has a unique cognitive architecture with truthful-by-construction
  blind spots. The jury must weigh the evidence and reach a verdict:
  Guilty of First-Degree Murder, Guilty of Voluntary Manslaughter,
  or Not Guilty.

  Evidence presented includes:
  - 911 calls and timeline
  - Autopsy findings (7 lacerations, thyroid cartilage fracture)
  - Blood spatter analysis (contested — Duane Deaver testimony)
  - Toxicology (BAC 0.07, Valium present)
  - Prior similar death (Elizabeth Ratliff, 1985)
  - Missing blow poke / fireplace poker
  - Michael Peterson's bisexuality and secret affairs
  - Owl theory (feathers found in Kathleen's hair)
  - SBI misconduct (Deaver fired, false testimony)
  - $1.5M life insurance policy

tags: [jury, criminal_law, deliberation, staircase, true_crime]
difficulty: advanced

