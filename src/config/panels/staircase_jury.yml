topics:
  - "State v. Michael Peterson — The Staircase Death"
  - "Evidence: 911 Call Timeline"
  - "Forensic Evidence: Blood Spatter and Autopsy"
  - "Prior Acts: Elizabeth Ratliff's Death (1985)"
  - "Motive: Insurance Policy and Bisexuality"
